name: Sincronizar Garmin

on:
  schedule:
    # 03:00, 14:00 y 20:00 UTC ~= 21:00, 08:00 y 14:00 hora Ciudad de Mexico (UTC-6)
    - cron: '0 3,14,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Traer datos de Garmin
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_DEBUG: '1'
        run: python scripts/garmin_sync.py

      - name: Publicar garmin-today.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garmin-today.json
          git diff --staged --quiet || git commit -m "Actualiza datos de Garmin"
          git push
